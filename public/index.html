<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Fortis - Kviz za zapošljavanje</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Screen - Click to enter fullscreen -->
    <div id="start-screen" class="start-screen">
        <div class="start-content">
            <img src="Logo.png" alt="Cyber Fortis Logo" class="start-logo">
            <h1>Cyber Fortis</h1>
            <p>Kviz za zapošljavanje - Cybersecurity</p>
            <button id="start-btn" class="btn btn-primary btn-large">Kliknite za početak</button>
        </div>
    </div>

    <div class="container hidden" id="main-container">
        <header>
            <img src="Logo.png" alt="Cyber Fortis Logo" class="logo">
            <h1>Cyber Fortis</h1>
            <p class="subtitle">Kviz za zapošljavanje - Cybersecurity</p>
        </header>

        <!-- Registration Form -->
        <div id="registration-form" class="card">
            <h2>Informacije o kandidatu</h2>
            <form id="user-form">
                <div class="form-group">
                    <label for="firstName">Ime *</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Prezime *</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email adresa *</label>
                    <input type="email" id="email" name="email" required pattern="[^\s@]+@[^\s@]+\.[^\s@]+" title="Molimo unesite ispravnu email adresu" placeholder="primjer@email.com">
                </div>
                <div class="form-group">
                    <label for="phone">Broj telefona *</label>
                    <input type="tel" id="phone" name="phone" required pattern="^\+?[0-9]+$" title="Molimo unesite ispravan broj telefona (samo brojevi, + je opciono na početku)" placeholder="+38591234567">
                </div>
                <button type="submit" class="btn btn-primary">Započni kviz</button>
            </form>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" class="card hidden">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div id="progress" class="progress-fill"></div>
                </div>
                <p class="question-counter">Pitanje <span id="current-question">1</span> od <span id="total-questions">20</span></p>
            </div>

            <div id="question-container">
                <h3 id="question-text"></h3>
                <div id="options-container" class="options">
                    <!-- Options will be dynamically inserted here -->
                </div>
            </div>

            <div class="quiz-navigation">
                <button id="prev-btn" class="btn btn-secondary" disabled>Prethodno</button>
                <button id="next-btn" class="btn btn-primary">Sljedeće</button>
                <button id="submit-btn" class="btn btn-success hidden">Završi kviz</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results-section" class="card hidden">
            <div class="results-content">
                <h2>Hvala što ste učestvovali, kontaktirat ćemo Vas uskoro!</h2>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 CYBERFORTIS. Sva prava zadržana.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
